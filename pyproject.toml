[project]
name = "bugops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahmoni Tobi", email = "125178232+Hugonybi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.62",
    "httpx2>=2.12.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.10.0",
    "rich>=15.0.0",
    "slack-sdk>=3.31.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
bugops-run-pipeline = "bugops.scripts.run_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["docker: requires a local Docker daemon (run explicitly with -m docker)"]
addopts = "-m 'not docker'"
